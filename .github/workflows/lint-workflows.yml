name: Lint workflows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-workflows:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@8f52551463b98b8845216c644f65ee68d01e95df  # main
    with:
      run-actionlint: true
      run-zizmor: true
