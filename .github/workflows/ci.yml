name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Install exactly the committed uv.lock so the tested environment
      # matches what the security job pip-audits.
      - name: Install dependencies
        run: |
          uv lock --check
          uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy rs_isaac_uav_sim

      - name: Test
        run: uv run pytest -m "not gpu and not isaac"

  security:
    # TruffleHog secret scan plus pip-audit of the committed uv.lock via the
    # shared fleet workflow. No extras: the project has no optional runtime
    # extras to audit (the shared default `tracing` does not exist here).
    permissions:
      contents: read
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      python-version: "3.11"
      install-extras: ""
      run-trufflehog: true

  modules-drift:
    name: modules-drift
    # robotsix-modules requires Python >= 3.14, so the taxonomy checks run in
    # their own job; a new top-level file or dir that docs/modules.yaml does
    # not register fails check-registration.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Install from the committed uv.lock (Python 3.14 also pulls in
      # robotsix-modules via the dev extra).
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Validate module taxonomy
        run: uv run robotsix-modules validate docs/modules.yaml

      - name: Check module registration
        run: uv run robotsix-modules check-registration docs/modules.yaml

      - name: Validate module paths
        run: uv run robotsix-modules validate-paths docs/modules.yaml
