[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rs_isaac_uav_sim"
dynamic = ["version"]
description = "Isaac Sim-based UAV simulation with ROS 2 autonomy (clean-slate rebuild)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
  # Module-taxonomy drift checks (docs/modules.yaml). Not on PyPI, and it
  # requires Python >= 3.14, so it is only installed on 3.14+ interpreters.
  "robotsix-modules @ git+https://github.com/damien-robotsix/robotsix-modules@v0.5.3 ; python_version >= '3.14'",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["rs_isaac_uav_sim"]

[tool.hatch.version]
path = "rs_isaac_uav_sim/__init__.py"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = false
disallow_any_unimported = false
warn_unused_ignores = true

[tool.pytest.ini_options]
markers = [
  "gpu: tests that require a GPU (deselected on standard CI).",
  "isaac: tests that require Isaac Sim (deselected on standard CI).",
]
