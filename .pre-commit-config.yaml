repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: |
          (?x)(
            uv\.lock|
            \.secrets\.baseline
          )

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Keep in sync with .secrets-patterns-excluded. Exclusions live in
        # pre-commit's `exclude:` regex because detect-secrets'
        # `--exclude-files` takes a regex, not a path to a patterns file,
        # so `--exclude-files .secrets-patterns-excluded` would be a no-op.
        exclude: ^(uv\.lock|\.secrets\.baseline)$
